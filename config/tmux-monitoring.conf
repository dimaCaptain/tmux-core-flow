# tmux-core-flow — monitoring fragment.
#
# Source this from your own ~/.tmux.conf, keeping your personal settings
# (prefix, splits, copy-mode, plugins) where they are:
#
#     source-file ~/path/to/tmux-core-flow/config/tmux-monitoring.conf
#
# It sets up only what claude-hook-notify needs to colour tabs, plus the
# idle-detection hook. Nothing here depends on a dashboard.

# --- Required for per-window colouring ---
# monitor-activity must be on: without it tmux discards the per-window
# window-status-style that claude-hook-notify sets, and every tab stays default.
# The visual bell/alert noise that normally comes with it is turned off — the
# colour *is* the notification.
setw -g monitor-activity on
set -g visual-activity off
setw -g monitor-bell off
set -g visual-bell off
set -g bell-action none

# Deliberately NO alert-activity hook: it would repaint a finished (red) agent
# back to working (yellow) on ambient output. claude-hook-notify owns the colours.

# --- Idle detection: 30 min of silence in a claude window → red ---
setw -g monitor-silence 1800
set-hook -g alert-silence "run-shell 'bash -c \"tmux list-panes -t #{session_name}:#{window_index} -F \\\\#{pane_current_command} 2>/dev/null | grep -q claude && tmux set-window-option -t #{session_name}:#{window_index} window-status-style \\\\\"bg=#f38ba8,fg=#1e1e2e,bold\\\\\"\"'"

# --- Colour convention (Catppuccin Mocha) ---
# These are the exact values claude-hook-notify writes and any dashboard reads.
# Change them here and in the hook together, or your widget will stop matching.
#
#   🟡 bg=#f9e2af  working          — agent is doing something
#   🟢 bg=#a6e3a1  needs approval   — waiting on you
#   🔴 bg=#f38ba8  finished / idle  — turn is over, or 30 min silent
#   ⚪ (unset)     inactive         — no agent in this window
#
# Base window-status styling is left to your own config so this fragment does
# not fight your theme; only the per-window overrides above are ours.
