<svg xmlns="http://www.w3.org/2000/svg" width="480" height="308" viewBox="0 0 480 308" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- window -->
  <g filter="url(#shadow)">
    <rect x="8" y="8" width="464" height="292" rx="10" fill="#1a1b26"/>
    <!-- title bar -->
    <path d="M8 18 a10 10 0 0 1 10 -10 h444 a10 10 0 0 1 10 10 v20 h-464 z" fill="#24283b"/>
    <circle cx="26" cy="24" r="5.5" fill="#f7768e"/>
    <circle cx="45" cy="24" r="5.5" fill="#e0af68"/>
    <circle cx="64" cy="24" r="5.5" fill="#9ece6a"/>
    <text x="240" y="29" text-anchor="middle" fill="#a9b1d6" font-size="12.5">Agents Dashboard</text>
  </g>

  <!-- body -->
  <!-- session: agents:web -->
  <line x1="28" y1="65" x2="46" y2="65" stroke="#414868" stroke-width="1.5"/>
  <text x="54" y="70" fill="#bb9af7" font-weight="bold">agents:web</text>
  <line x1="142" y1="65" x2="160" y2="65" stroke="#414868" stroke-width="1.5"/>

  <!-- 1. red  stew -->
  <text x="52" y="96" fill="#565f89" text-anchor="end">1.</text>
  <circle cx="70" cy="91" r="5" fill="#f7768e"/>
  <text x="86" y="96" fill="#f7768e">stew</text>
  <text x="250" y="96" fill="#f7768e">opus</text>
  <text x="368" y="96" fill="#f7768e">4m</text>

  <!-- 2. yellow arch-main -->
  <text x="52" y="122" fill="#565f89" text-anchor="end">2.</text>
  <circle cx="70" cy="117" r="5" fill="#e0af68"/>
  <text x="86" y="122" fill="#e0af68">arch-main</text>
  <text x="250" y="122" fill="#e0af68">opus</text>
  <text x="368" y="122" fill="#e0af68">38s</text>

  <!-- 3. yellow dev-api -->
  <text x="52" y="148" fill="#565f89" text-anchor="end">3.</text>
  <circle cx="70" cy="143" r="5" fill="#e0af68"/>
  <text x="86" y="148" fill="#e0af68">dev-api</text>
  <text x="250" y="148" fill="#e0af68">sonnet</text>
  <text x="368" y="148" fill="#e0af68">1m</text>

  <!-- 4. red qa-e2e -->
  <text x="52" y="174" fill="#565f89" text-anchor="end">4.</text>
  <circle cx="70" cy="169" r="5" fill="#f7768e"/>
  <text x="86" y="174" fill="#f7768e">qa-e2e</text>
  <text x="250" y="174" fill="#f7768e">haiku</text>
  <text x="368" y="174" fill="#f7768e">12m</text>

  <!-- session: agents:infra -->
  <line x1="28" y1="199" x2="46" y2="199" stroke="#414868" stroke-width="1.5"/>
  <text x="54" y="204" fill="#bb9af7" font-weight="bold">agents:infra</text>
  <line x1="158" y1="199" x2="176" y2="199" stroke="#414868" stroke-width="1.5"/>

  <!-- 1. yellow dev-terraform -->
  <text x="52" y="230" fill="#565f89" text-anchor="end">1.</text>
  <circle cx="70" cy="225" r="5" fill="#e0af68"/>
  <text x="86" y="230" fill="#e0af68">dev-terraform</text>
  <text x="250" y="230" fill="#e0af68">sonnet</text>
  <text x="368" y="230" fill="#e0af68">22s</text>

  <!-- 2. gray shell -->
  <text x="52" y="256" fill="#565f89" text-anchor="end">2.</text>
  <circle cx="70" cy="251" r="5" fill="#565f89"/>
  <text x="86" y="256" fill="#565f89">shell</text>
  <text x="250" y="256" fill="#565f89">—</text>
  <text x="368" y="256" fill="#565f89">—</text>

  <!-- footer -->
  <text x="28" y="284" fill="#565f89">[Ctrl+C=quit]</text>
